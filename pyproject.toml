[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linguabot"
version = "2.0.0"
description = "Assistente de aprendizagem de idiomas no Telegram (adultos e crianças)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot==22.5",
    "python-dotenv==1.1.1",
    "edge-tts==7.2.3",
    "gTTS==2.5.4",
    "imageio-ffmpeg==0.6.0",
    "Pillow==11.3.0",
    "vosk==0.3.45",
    "soundfile==0.14.0",
    "numpy==2.5.4",
]

[project.optional-dependencies]
gemini = ["google-genai==1.45.0"]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[project.scripts]
linguabot = "linguabot.__main__:main"

[tool.setuptools]
packages = ["linguabot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
